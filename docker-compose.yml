services:
  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: teavision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teavision}
      POSTGRES_USER: ${POSTGRES_USER:-teavision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teavision} -d ${POSTGRES_DB:-teavision}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - teavision-network

  # ─── Go REST API ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: teavision-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-teavision}:${POSTGRES_PASSWORD:-changeme_strong_password}@postgres:5432/${POSTGRES_DB:-teavision}?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_at_least_32_chars}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      API_PORT: "8080"
      ML_SERVICE_URL: "http://ml:8000"
      API_ENV: ${API_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "8080:8080"
    networks:
      - teavision-network

  # ─── Python FastAPI ML Inference Service ──────────────────────────────────
  ml:
    build:
      context: ./services/ml
      dockerfile: Dockerfile
    container_name: teavision-ml
    restart: unless-stopped
    environment:
      MODEL_PATH: ${MODEL_PATH:-/app/models/tea_grader.pt}
      ML_ENV: ${ML_ENV:-development}
      ML_PORT: "8000"
    volumes:
      - ./ml/models:/app/models
    ports:
      - "8000:8000"
    networks:
      - teavision-network

  # ─── Next.js Analytics Web Dashboard ─────────────────────────────────────
  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    container_name: teavision-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme_nextauth_secret}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_ML_URL: ${NEXT_PUBLIC_ML_URL:-http://localhost:8000}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3000:3000"
    networks:
      - teavision-network

  # ─── Nginx Reverse Proxy & Gateway ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: teavision-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
      ml:
        condition: service_started
      web:
        condition: service_started
    networks:
      - teavision-network

volumes:
  pgdata:
    name: teavision_pgdata

networks:
  teavision-network:
    name: teavision_network
    driver: bridge
