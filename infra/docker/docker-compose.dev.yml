# ─── Development Override Compose Configuration ──────────────────────────────
# Usage from repo root:
#   docker compose -f docker-compose.yml -f infra/docker/docker-compose.dev.yml up --build

services:
  # ─── Go API (Hot Reload with Air) ──────────────────────────────────────────
  api:
    command: air -c .air.toml
    volumes:
      - ./services/api:/app
    environment:
      API_ENV: development
      LOG_LEVEL: debug

  # ─── ML Service (Live reload with Uvicorn) ─────────────────────────────────
  ml:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/ml:/app
      - ./ml/models:/app/models
    environment:
      ML_ENV: development

  # ─── Next.js Dashboard (Fast Refresh Dev Server) ───────────────────────────
  web:
    command: npm run dev
    volumes:
      - ./services/web:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development

  # ─── Adminer Database GUI ──────────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: teavision-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: hydra
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - teavision-network
