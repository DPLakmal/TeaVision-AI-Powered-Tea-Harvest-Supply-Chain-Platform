user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Logging Configuration ───────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # ─── Basic Settings ──────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;

    # ─── Request Body Size (20M for leaf image uploads) ──────────────────────
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # ─── Timeouts ────────────────────────────────────────────────────────────
    proxy_connect_timeout 60s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
    send_timeout          120s;

    # ─── Gzip Compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ─── Upstreams ───────────────────────────────────────────────────────────
    upstream api_service {
        server api:8080;
        keepalive 32;
    }

    upstream ml_service {
        server ml:8000;
        keepalive 32;
    }

    upstream web_service {
        server web:3000;
        keepalive 32;
    }

    # ─── Server Configuration ────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # ─── Security Headers ────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ─── Default Proxy Headers ───────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # ─── Route: Go REST API ──────────────────────────────────────────────
        location /api/ {
            proxy_pass http://api_service/api/;
            proxy_buffering off;
        }

        # ─── Route: FastAPI ML Inference ─────────────────────────────────────
        location /ml/ {
            proxy_pass http://ml_service/;
            proxy_buffering off;
        }

        # ─── Route: Swagger Documentation ────────────────────────────────────
        location /swagger/ {
            proxy_pass http://api_service/swagger/;
            proxy_buffering off;
        }

        # ─── Route: Next.js Frontend Dashboard (Default) ────────────────────
        location / {
            proxy_pass http://web_service/;
            # WebSocket and dynamic page support for Next.js
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
